name: Build APK NO SDK LOOP

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip build-essential

        pip install --upgrade pip
        pip install cython==0.29.36 python-for-android

    - name: Build APK (NO BUILDTOOLS / NO AIDL)
      run: |
        p4a apk \
          --private . \
          --package org.test.calculator \
          --name Calculator \
          --version 0.1 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy \
          --arch arm64-v8a \
          --output bin/app.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk