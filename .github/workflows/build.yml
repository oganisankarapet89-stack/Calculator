name: Build APK (stable)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK using Buildozer Docker (STABLE)
      run: |
        docker run --rm -v $PWD:/home/user/app \
        kivy/buildozer buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk