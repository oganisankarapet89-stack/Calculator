name: Build APK (stable docker)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK in Docker (no prompts)
      run: |
        docker run --rm \
        -e CI=1 \
        -e PIP_BREAK_SYSTEM_PACKAGES=1 \
        -v $PWD:/home/user/app \
        kivy/buildozer \
        bash -c "
          cd /home/user/app &&
          yes | buildozer android debug
        "

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk