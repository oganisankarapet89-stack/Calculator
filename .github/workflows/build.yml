name: Build APK Stable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK using official p4a Docker (NO SDK ISSUES)
      run: |
        docker run --rm \
        -v $PWD:/app \
        -w /app \
        kivy/buildozer \
        bash -c "
          pip install --upgrade pip &&
          buildozer android clean &&
          buildozer android debug
        "

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk