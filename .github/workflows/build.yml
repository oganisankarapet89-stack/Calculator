name: Build APK FINAL (FIX ALL)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ✅ ФИКС Java (иначе sdkmanager падает)
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip wget \
          build-essential \
          autoconf automake libtool \
          libtool-bin m4 pkg-config \
          libffi-dev libssl-dev

    - name: Install Python tools
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    # 🔥 СТАВИМ SDK В НУЖНОЕ МЕСТО (.buildozer!)
    - name: Install Android SDK (FIX AIDL FINAL)
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip

        # правильная структура без mv-ошибки
        mkdir -p cmdline-tools/latest
        cp -r cmdline-tools/* cmdline-tools/latest/ || true

        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses

        # 🔥 СТАВИМ ВСЁ ЧТО НУЖНО ДЛЯ AIDL
        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Clean broken cache
      run: |
        rm -rf .buildozer || true

    # 🔥 ГЛАВНОЕ: указываем Buildozer правильный SDK путь
    - name: Build APK
      run: |
        export CI=1
        export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk