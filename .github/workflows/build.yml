name: Build APK FIXED

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          python3-pip build-essential \
          autoconf automake libtool pkg-config

        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Pre-create Android environment (FIX AIDL + LICENSE)
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        mkdir -p $HOME/.buildozer/android/platform/android-sdk

        yes | sdkmanager --licenses || true

    - name: Build APK (NO SDK INSTALL STEP)
      run: |
        export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk"
        export CI=1

        buildozer android clean
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk