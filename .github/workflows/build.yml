name: Build APK (Docker Stable)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK in Docker (stable environment)
      run: |
        docker run --rm \
        -v $PWD:/home/user/app \
        kivy/buildozer \
        bash -c "cd /home/user/app && buildozer android debug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk