name: Build APK FINAL (ABSOLUTE FIX)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ✅ Java 17 (fix sdkmanager crash)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip wget \
          build-essential \
          autoconf automake libtool \
          libtool-bin m4 pkg-config \
          libffi-dev libssl-dev

    - name: Install Python tools
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    # 🔥 SDK FIX (ВСЕ ПРОБЛЕМЫ РЕШЕНЫ ЗДЕСЬ)
    - name: Install Android SDK FULL FIX
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip

        mkdir -p cmdline-tools/latest
        cp -r cmdline-tools/* cmdline-tools/latest/ || true

        # 🔥 СОЗДАЁМ СТАРЫЙ ПУТЬ (ГЛАВНЫЙ ФИКС)
        mkdir -p tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager

        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses

        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Clean cache
      run: |
        rm -rf .buildozer || true

    - name: Build APK
      run: |
        export CI=1
        export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk