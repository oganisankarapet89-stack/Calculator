name: Build APK Stable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK (no interactive input)
      run: |
        docker run --rm \
        -v $PWD:/app \
        -w /app \
        -e CI=1 \
        -e BUILDOZER_ALWAYS_YES=1 \
        kivy/buildozer \
        bash -c "
          export CI=1 &&
          export BUILDOZER_ALWAYS_YES=1 &&
          yes | buildozer android debug
        "

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk